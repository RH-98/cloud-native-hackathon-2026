# Checks every pull request before it can deploy. Gitar reads these results:
# when a check fails, it posts the root cause and, with auto-apply on, a fix.
name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Syntax check
        working-directory: app
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Tests
        working-directory: app
        run: npm test --if-present

      - name: Smoke test (health endpoints, with OpenTelemetry loaded)
        working-directory: app
        env:
          NODE_OPTIONS: --require @opentelemetry/auto-instrumentations-node/register
          OTEL_TRACES_EXPORTER: none
          OTEL_METRICS_EXPORTER: none
          OTEL_LOGS_EXPORTER: none
        run: |
          PORT=8080 node server.js &
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/healthz && curl -fsS http://localhost:8080/readyz; then
              exit 0
            fi
            sleep 0.5
          done
          echo "The app did not answer /healthz and /readyz on port 8080" >&2
          exit 1

      - name: Container build
        run: docker build --tag ci-check .
