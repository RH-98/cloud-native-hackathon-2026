apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  # Remove this line when you turn on the HPA (examples/hpa), or Argo CD and
  # the autoscaler will keep resetting each other.
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      # The app never calls the Kubernetes API, so it needs no token.
      automountServiceAccountToken: false
      # Prefer different nodes for the replicas, but never block scheduling:
      # the vcluster's nodes are shared host nodes.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: app
      volumes:
        # The root filesystem is read-only; this is the only writable path.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TEAM_NAME
              value: "ryan-hilton-real"
            # Planner data sources. Keys live in the app-credentials Secret, never in git.
            - name: ELASTICSEARCH_URL
              value: "https://my-vectordb-project-ebb49c.es.us-east4.gcp.elastic.cloud:443"
            - name: ELASTICSEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: elasticsearch-api-key
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: github-token
            # Accounts (optional): sign in with GitHub, saved plans in Postgres.
            # OAuth App id/secret and the session secret are in app-credentials;
            # DATABASE_URL comes from the CloudNativePG Secret db-app. All optional:
            # pods start before the database exists, and accounts stay off until
            # every value is there.
            - name: PUBLIC_URL
              value: "https://ryan-hilton-real.cnh.radarhq.io"
            - name: GITHUB_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: github-oauth-client-id
                  optional: true
            - name: GITHUB_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: github-oauth-client-secret
                  optional: true
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: session-secret
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: uri
                  optional: true
            # Private repos (optional): the read-only GitHub App (Contents and
            # Metadata: read). Off unless all three are set.
            - name: GITHUB_APP_SLUG
              value: switchback-conference-scheduler
            - name: GITHUB_APP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: github-app-client-id
                  optional: true
            - name: GITHUB_APP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: github-app-client-secret
                  optional: true
            # OpenTelemetry: traces, metrics and explicitly emitted logs go to Dash0.
            # The auth header lives in the app-credentials Secret, never in git.
            - name: NODE_OPTIONS
              # telemetry.js (in app/) wraps the auto-instrumentation: no spans
              # for /healthz and /readyz, and service.version from APP_VERSION.
              value: "--require ./telemetry.js"
            - name: OTEL_SERVICE_NAME
              value: "conference-planner"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "https://ingress.us-west-2.aws.dash0.com"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: otel-exporter-otlp-headers
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "otlp"
            - name: OTEL_NODE_DISABLED_INSTRUMENTATIONS
              value: "fs"
            # Skip the cloud metadata detectors (GCP, AWS, Azure...): the nodes
            # are shared host nodes, and the probes slow start-up.
            - name: OTEL_NODE_RESOURCE_DETECTORS
              value: "env,host,os,process,serviceinstance"
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.namespace.name=team-ryan-hilton-real,k8s.pod.name=$(K8S_POD_NAME),k8s.pod.uid=$(K8S_POD_UID),deployment.environment.name=hackathon"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              # Raised from 256Mi: the OpenTelemetry SDK adds memory overhead.
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
