# Argo CD deploys this folder to your team's namespace. The GitHub Action
# sets the image below on every push to main; don't edit newName or newTag
# by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: team-ryan-hilton-real
resources:
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - pdb.yaml
  - postgres.yaml
  - schedule-overrides.yaml
  - schedule-watch.yaml
images:
  - name: app
    newName: ghcr.io/rh-98/cloud-native-hackathon-2026
    newTag: "f09654c"
